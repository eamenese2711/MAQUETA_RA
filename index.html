<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Virtual RA</title>
  <!-- Carga de la librería oficial de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: Arial, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* Botón flotante blindado (fuera de model-viewer para evitar que se oculte) */
    #custom-ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 30px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 99999;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #custom-ar-button:active {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <!-- Visor 3D -->
  <model-viewer 
    id="viewer"
    src="modelo_1.glb" 
    alt="Maqueta Virtual 3D"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1">
  </model-viewer>

  <!-- Botón personalizado independiente -->
  <button id="custom-ar-button">
    📐 Ver en Realidad Aumentada
  </button>

  <script>
    const viewer = document.getElementById('viewer');
    const arButton = document.getElementById('custom-ar-button');

    arButton.addEventListener('click', () => {
      // 1. Obtiene automáticamente la URL pública completa de modelo_1.glb en GitHub
      const fullGlbUrl = new URL('modelo_1.glb', window.location.href).href;

      // 2. Detecta si el usuario está escaneando desde un teléfono Android
      const isAndroid = /android/i.test(navigator.userAgent);

      if (isAndroid) {
        // Ejecuta la orden nativa de Android para abrir Scene Viewer directamente
        const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(fullGlbUrl)}&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;`;
        window.location.href = intentUrl;
      } else {
        // En iOS (iPhone) o navegador compatible, usa la función interna de model-viewer
        if (viewer.canActivateAR) {
          viewer.activateAR();
        } else {
          alert("Tu navegador o dispositivo no admite la proyección en Realidad Aumentada.");
        }
      }
    });
  </script>

</body>
</html>
