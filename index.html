<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Virtual RA</title>
  <!-- Carga de la librería para visualizar en 3D -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: Arial, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* Botón de enlace nativo e indestructible */
    .ar-button-link {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 99999;
      display: inline-block;
      text-align: center;
      white-space: nowrap;
    }
    .ar-button-link:active {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <!-- Renderizado del modelo 3D en pantalla -->
  <model-viewer 
    src="modelo_1.glb" 
    alt="Maqueta Virtual 3D"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1">
  </model-viewer>

  <!-- Enlace nativo directo al sistema operativo Android -->
  <a class="ar-button-link" 
     href="intent://arvr.google.com/scene-viewer/1.0?file=https://eamenese2711.github.io/MAQUETA_RA/modelo_1.glb&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;">
    📐 Ver en Realidad Aumentada
  </a>

</body>
</html>
